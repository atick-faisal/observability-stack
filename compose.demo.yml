# Local end-to-end demo. Overlays compose.yml and agent/compose.agent.yml in the
# same Compose project, so these containers join the `obs` network and reach
# tempo/loki/prometheus by name.
#
#   make demo-up
#
# The agent files are used unmodified — that is the point of the demo. What is
# app-specific lives here: the three `obs.*` labels on each container, and the
# agent's own settings, which a real app repo would put in observability/.env.agent
# instead. They are inline because none of them is a secret: the URLs are
# in-network and the credential is demo/demo, which .env.server.example ships the
# matching hash for. `make demo-up EDGE=1` is where it is actually enforced.

volumes:
  demo_db_data: {}

services:
  alloy:
    environment:
      OBS_APP: demo
      OBS_ENV: local
      OBS_HOST: demo-host
      # Direct by default, which keeps the local loop fast and independent of the
      # edge. `make demo-up EDGE=1` overrides all three with
      # https://ingest.localhost/... and turns on OBS_INGEST_TLS_INSECURE, which is
      # the whole diff between the local path and the deployed one — proof that
      # onboarding an app is three URLs and two credentials, as PLAN §7 claims.
      OBS_PROM_URL: ${OBS_PROM_URL:-http://prometheus:9090/api/v1/write}
      OBS_LOKI_URL: ${OBS_LOKI_URL:-http://loki:3100/loki/api/v1/push}
      OBS_TRACES_URL: ${OBS_TRACES_URL:-http://tempo:4318}
      OBS_INGEST_USER: ${OBS_INGEST_USER:-demo}
      OBS_INGEST_PASSWORD: ${OBS_INGEST_PASSWORD:-demo}
      OBS_INGEST_TLS_INSECURE: ${OBS_INGEST_TLS_INSECURE:-false}
      # Not strictly needed here — nothing joins two networks — but it keeps the
      # knob exercised, and the value shows the form: <project>_<network>.
      OBS_DOCKER_NETWORK: observability_obs
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - obs

  cadvisor:
    networks:
      - obs

  postgres_exporter:
    environment:
      DATA_SOURCE_URI: demo-db:5432/demo?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${DEMO_DB_PASSWORD:-demo}
    depends_on:
      demo-db:
        condition: service_healthy
    networks:
      - obs

  demo-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      # Local only: no host port is published, so this reaches nothing off-box.
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo}
      POSTGRES_DB: demo
      # Read by postgres-exporter-init.sql below, via psql's \getenv.
      POSTGRES_EXPORTER_PASSWORD: ${DEMO_DB_PASSWORD:-demo}
    volumes:
      # Postgres 18 moved the data directory: the mount goes at
      # /var/lib/postgresql, and the image puts the cluster in an 18/docker
      # subdirectory. Mounting the old /var/lib/postgresql/data refuses to boot.
      - demo_db_data:/var/lib/postgresql
      # Runs once, on a fresh volume. `make demo-down` removes the volume, so a
      # down/up cycle re-runs it.
      - ./agent/postgres-exporter-init.sql:/docker-entrypoint-initdb.d/10-postgres-exporter.sql:ro
    networks:
      - obs
    labels:
      obs.service: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-api:
    build:
      context: .
      dockerfile: demo/app/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      OBS_APP: demo
      OBS_SERVICE: api
      OBS_ENV: local
      OBS_HOST: demo-host
      OBS_VERSION: 0.1.0
      # Explicit, not `auto`. `auto` renders to the console when env=local, which
      # is exactly what the local demo is — and Alloy's stage.json (M4) parses
      # JSON. Without this the demo would exercise a log path production never uses.
      OBS_LOG_FORMAT: json
      OBS_LOG_LEVEL: INFO
      # The whole of what the agent changes for an app: one variable, from the
      # collector's address to the local agent's. Everything else — the labels,
      # the SDK call, the log format — is identical either way.
      OBS_OTLP_ENDPOINT: http://alloy:4317
      # Empty by default, which is what obstack treats as "no error reporting" — the
      # demo runs unchanged without GlitchTip. With one up, export the DSN its UI
      # hands you and `make demo-up` again. Which DSN depends on where it runs:
      #
      #   OBS_ERROR_DSN=http://<key>@glitchtip-web:8000/1 make demo-up      # make glitchtip-up
      #   OBS_ERROR_DSN=https://<key>@errors.<domain>/1 make demo-up        # deployed
      #
      # The first is the compose service name, not localhost:8001 — this is dialled
      # from inside the container, over the `obs` network glitchtip-web joins. It only
      # resolves when GlitchTip is in *this* Compose project; deployed as its own
      # service it is a separate project with its own `obs`, and the public hostname
      # is the only way in. GlitchTip generates whichever DSN matches its
      # GLITCHTIP_DOMAIN, so the UI hands you the right one either way.
      OBS_ERROR_DSN: ${OBS_ERROR_DSN:-}
      DATABASE_URL: postgresql+asyncpg://demo:${DEMO_DB_PASSWORD:-demo}@demo-db:5432/demo
    depends_on:
      demo-db:
        condition: service_healthy
      alloy:
        condition: service_started
    networks:
      - obs
    labels:
      obs.service: api
      obs.metrics.port: "8000"
      obs.metrics.path: /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  demo-loadgen:
    build:
      context: .
      dockerfile: demo/loadgen/Dockerfile
    restart: unless-stopped
    expose:
      - "9101"
    environment:
      OBS_APP: demo
      OBS_SERVICE: loadgen
      OBS_ENV: local
      OBS_HOST: demo-host
      OBS_VERSION: 0.1.0
      OBS_LOG_FORMAT: json
      OBS_LOG_LEVEL: INFO
      OBS_OTLP_ENDPOINT: http://alloy:4317
      LOADGEN_TARGET: http://demo-api:8000
      LOADGEN_RATE: "5"
    depends_on:
      demo-api:
        condition: service_healthy
    networks:
      - obs
    labels:
      obs.service: loadgen
      obs.metrics.port: "9101"
      obs.metrics.path: /metrics
