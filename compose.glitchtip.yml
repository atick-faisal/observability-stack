# Error tracking. Deployable two ways, from this one file.
#
# Alongside the LGTM stack, in the same Compose project — glitchtip-web then lands on
# the same `obs` and `edge` networks those services use, so an app on this box can
# POST events to glitchtip-web:8000 directly:
#
#   COMPOSE_PROJECT_NAME=observability \
#     docker compose --env-file .env.glitchtip -f compose.glitchtip.yml up -d
#
# The project name is what puts it in that project, and it is set on the command line
# rather than as `name:` here — this file has to take its name from whatever deploys
# it. `make glitchtip-up` does exactly the above.
#
# Or on its own, as its own project — which is what a platform that deploys one
# compose file per service (Dokploy, Coolify) gives you:
#
#   docker compose --env-file .env.glitchtip -f compose.glitchtip.yml up -d
#
# The second shape is why the `obs` and `edge` networks are declared below and not
# only in compose.lgtm.yml. They are declared identically in both, so Compose merges them
# without conflict when the files are overlaid. Note what a separate project costs:
# its `obs` network is project-local, so glitchtip-web:8000 is *not* reachable from
# the LGTM project's containers. Apps report over https://errors.<domain> instead,
# which is what an app on any other host does anyway.
#
# Locally, add compose.glitchtip.local.yml for a 127.0.0.1 port — `make glitchtip-up`
# does that for you. This file publishes nothing, which is the same invariant
# compose.lgtm.yml holds: errors.<domain> through Traefik is the only way in.
#
# GlitchTip is deliberately a separate file rather than a profile in compose.lgtm.yml.
# It is five more containers and a second Postgres; a stack that only wants metrics,
# logs and traces should not pay for them.
#
# Its settings are interpolated by Compose from .env.glitchtip, or from the
# environment UI of whatever deploys this. So the `$$`-doubling rule that applies to
# .env.lgtm applies here too: a single `$` in a value is eaten. `openssl rand -hex
# 32` cannot produce one, and .env.glitchtip.example asks for an alphanumeric
# database password for the same reason scripts/add-ingest-user.sh generates one.
#
# These were an `env_file:` until GlitchTip had to deploy behind a platform that
# re-clones the repo, where a gitignored file is never present. `env_file:` was
# removed rather than kept alongside `environment:`, because Compose ranks
# `environment:` higher — the file would still be read, discarded, and look
# authoritative while doing nothing. That is exactly how agent/.env.agent failed.

networks:
  # Private to these five. `obs` carries the LGTM services *and* the demo's app
  # containers, and GlitchTip's database holds exception payloads — stack traces,
  # request headers, local variables — from every app that reports here. Only the
  # web container leaves this network, because only it has to.
  glitchtip:
    driver: bridge
  # Declared identically in compose.yml; see the header. Present here so this file
  # renders on its own, which `make glitchtip-config-check` asserts.
  obs:
    driver: bridge
  edge:
    name: ${OBS_EDGE_NETWORK:-observability_edge}
    external: ${OBS_EDGE_EXTERNAL:-false}

volumes:
  glitchtip_pg_data: {}
  # Shared by web and worker: the web process writes an uploaded sourcemap or
  # release artifact, the worker reads it.
  glitchtip_uploads: {}

# Docker's default json-file driver has no max-size and no max-file, so a container
# log grows until the disk is full. These five carry obs.logs: "false", so nothing
# ships them, nothing reads them and nothing truncates them — and they share a disk
# with glitchtip_pg_data, which is every error ever reported. See compose.yml for
# the /etc/docker/daemon.json default that catches anything added later.
x-obs-logging: &obs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-glitchtip-app: &glitchtip-app
  # Digest-pinned, and of the three pins this is the one that matters: `:6` is a
  # whole minor series, and glitchtip-migrate runs Django migrations on every
  # `up`. An unattended minor bump therefore rewrites the schema of the database
  # holding every error ever reported, and migrations do not run backwards.
  # Re-pin deliberately, with a backup taken first: ./scripts/resolve-digests.sh
  image: glitchtip/glitchtip:6@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
  logging: *obs-logging
  environment:
    # `:?` rather than a default on everything that has no safe one. A missing value
    # then fails the render with the message below, instead of booting a container
    # that half-works — an empty SECRET_KEY invalidates every session, and an
    # ALLOWED_HOSTS that does not list the public hostname is a 400 on every request
    # with no clue as to why.
    SECRET_KEY: ${SECRET_KEY:?generate one with `openssl rand -hex 32`}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?every Host header GlitchTip must answer on, comma-separated}
    # Assembled from the parts rather than carried as a fourth copy of the same
    # credential, so it cannot drift from what glitchtip-postgres was created with.
    # It is a URL: a `#`, `@` or `:` in the password has to be percent-encoded, which
    # is the other reason to keep that password alphanumeric.
    DATABASE_URL: postgres://${POSTGRES_USER:-glitchtip}:${POSTGRES_PASSWORD:?set GlitchTip's database password}@glitchtip-postgres:5432/${POSTGRES_DB:-glitchtip}
    # Celery's broker as well as the cache. An empty string makes GlitchTip fall back
    # to the database, which works and is slower.
    VALKEY_URL: ${VALKEY_URL:-redis://glitchtip-valkey:6379/0}
    # The port GlitchTip listens on inside the container. The Traefik label and the
    # healthcheck below both assume 8000; change all three together. Named
    # GLITCHTIP_PORT outside the container because `PORT` is too generic to put in a
    # shared environment UI.
    PORT: ${GLITCHTIP_PORT:-8000}
    # Matched to Prometheus's 30d rather than left at GlitchTip's 90d default: an
    # error you cannot pull up the metrics, logs and trace for is an error you cannot
    # investigate, and those expire at 30d / 14d / 7d.
    GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
    # Anyone who can reach errors.<domain> can create an account while this is true.
    # True for the first signup — that account becomes the first organisation's owner
    # — then false, and redeploy. Invite everyone else.
    ENABLE_USER_REGISTRATION: ${ENABLE_USER_REGISTRATION:-true}
    # consolemail:// prints mail to stdout instead of sending it. Fine locally, not
    # fine in production: password-reset links are mail, so with no real transport
    # the only account recovery is a shell on the box.
    EMAIL_URL: ${EMAIL_URL:-consolemail://}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-errors@example.com}
    # min,max concurrency. Unset means one worker per CPU core, which on a shared VPS
    # is how GlitchTip ends up competing with Prometheus for memory.
    CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}
    # Derived from OBS_DOMAIN rather than chosen, and not a secret. Despite the name
    # it is a full URL — settings.py raises
    # ImproperlyConfigured unless it starts with http or https. It is what GlitchTip
    # builds outbound links and generated DSNs from, and its scheme is what decides
    # whether session and CSRF cookies get the Secure flag.
    GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
    # Django compares the browser's Origin header against `<request scheme>://<host>`
    # on every unsafe request, and falls back to this list when they differ. Measured
    # here: a login POST through Traefik's TLS, with a browser Origin, is accepted
    # with this list empty — granian passes the forwarded scheme through, so Django
    # already sees https and the origins match without help. It is set anyway
    # because that is a property of the app server, not of GlitchTip's
    # configuration, and GlitchTip derives nothing here (settings.py:749 reads the
    # variable straight from the environment, defaulting to empty). Same value as
    # above, one variable, so the two cannot drift.
    CSRF_TRUSTED_ORIGINS: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
  volumes:
    - glitchtip_uploads:/code/uploads
  networks:
    - glitchtip

services:
  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *obs-logging
    # The same three values DATABASE_URL above is assembled from, so the cluster this
    # creates and the URL GlitchTip dials cannot drift apart. A dedicated role and
    # database, not the `postgres` superuser: GlitchTip needs no rights beyond its
    # own schema.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glitchtip}
      POSTGRES_USER: ${POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set GlitchTip's database password}
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql/data
    networks:
      - glitchtip
    labels:
      obs.logs: "false"
    healthcheck:
      # $$ so Compose passes the literal $ through to the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  glitchtip-valkey:
    # Digest-pinned. `:8-alpine` floats within the major, so this one is only
    # patch-level drift — but it is GlitchTip's queue, and a queue that changes
    # underneath a pinned app version is the kind of variable worth removing.
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    logging: *obs-logging
    networks:
      - glitchtip
    labels:
      obs.logs: "false"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot. Everything else waits for it to exit 0, so the web process never
  # boots against a schema that is not there yet.
  glitchtip-migrate:
    <<: *glitchtip-app
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    labels:
      obs.logs: "false"

  glitchtip-web:
    <<: *glitchtip-app
    restart: unless-stopped
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    networks:
      # The only container of the five on more than one network. `obs` is how
      # demo-api (and any app sharing the box) POSTs events to glitchtip-web:8000;
      # `edge` is how Traefik dials it.
      - glitchtip
      - obs
      - edge
    labels:
      obs.logs: "false"
      traefik.enable: "true"
      # Without this Traefik picks one of the three arbitrarily and the route 504s
      # intermittently — same reason compose.yml sets it on every service.
      traefik.docker.network: ${OBS_EDGE_NETWORK:-observability_edge}
      traefik.http.routers.obs-glitchtip.rule: "Host(`errors.${OBS_DOMAIN:-localhost}`)"
      traefik.http.routers.obs-glitchtip.entrypoints: "websecure"
      traefik.http.routers.obs-glitchtip.tls.certresolver: "letsencrypt"
      traefik.http.routers.obs-glitchtip.middlewares: "obs-glitchtip-headers@docker"
      traefik.http.services.obs-glitchtip.loadbalancer.server.port: "8000"
      # The same four settings compose.lgtm.yml puts on the grafana container as
      # obs-secure-headers, deliberately duplicated rather than referenced.
      # Traefik reads a middleware definition off whichever container carries it,
      # so referencing Grafana's copy works — but only while both stacks share one
      # Traefik on one box. Deployed as its own service, that middleware does not
      # exist and Traefik fails the router closed with a 404. Four label lines are
      # what make this file stand alone in function as well as in syntax.
      traefik.http.middlewares.obs-glitchtip-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.obs-glitchtip-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.obs-glitchtip-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.obs-glitchtip-headers.headers.referrerPolicy: "strict-origin-when-cross-origin"
    healthcheck:
      # The image ships no curl or wget, but it is a Python image by construction.
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://localhost:8000/_health/')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  glitchtip-worker:
    <<: *glitchtip-app
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    labels:
      obs.logs: "false"
