global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_native_histograms: true

storage:
  tsdb:
    # Agents buffer samples locally while this VPS is down. Without a window,
    # everything they replay on reconnect is rejected as too old and the gap
    # is permanent. See docs/archive/TASKS.md M9.
    #
    # The invariant: **this must be at least the agent's max_keepalive_time**
    # (agent/config.alloy, 8h). The agent is the authoritative number — it is the
    # one that says how long an outage can run — so this follows it, and moving
    # either without the other reintroduces the hole.
    #
    # It was 2h against an 8h buffer, which looks survivable and is not. A single
    # agent replays in order into a head whose max time is the moment it went
    # down, so it barely uses the out-of-order path at all. The window is what
    # keeps a *second* agent's replay from being rejected against the first's
    # live writes — and two app hosts is the premise of this repo, not an edge
    # case. Past 2h the samples were dropped and the agent reported success.
    #
    # Widening is close to free in steady state: the out-of-order head holds only
    # samples actually received out of order, so it costs memory during the
    # replay it exists for and nothing the rest of the time.
    out_of_order_time_window: 8h
  exemplars:
    max_exemplars: 200000

scrape_configs:
  # Everything else arrives via remote_write from the agents. These are the only
  # pull targets on the server, and they are the stack watching itself.
  #
  # Metrics only — the `obs.logs: "false"` on every service in compose.lgtm.yml
  # stays. That flag is about Loki ingesting its own logs, a feedback loop these
  # do not have.
  #
  # Why this exists at all: Grafana was OOM-killed 22 times in 14 days and not one
  # of them left a trace anywhere in this stack. Diagnosing it needed journalctl
  # on the host, which is the wrong answer for an observability system. The two
  # series that would have shown it immediately are process_resident_memory_bytes
  # (against the mem_limit) and process_start_time_seconds — a drop in
  # `time() - process_start_time_seconds` is a restart, whatever caused it.
  #
  # Note the recorder survives what it records: Prometheus is not the process
  # that dies.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: observability
          service: prometheus

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          app: observability
          service: grafana

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          app: observability
          service: loki

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          app: observability
          service: tempo
