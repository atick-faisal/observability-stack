# Local development overlay. Adds back the two things the deployed stack does not
# want: ports published on the host, and configuration bind-mounted from the
# working tree instead of baked into the image.
#
#   docker compose -f compose.lgtm.yml -f compose.lgtm.local.yml up -d
#
# The bind mounts shadow the image's copy of the same files, so an edit here takes
# effect without a rebuild — which is what makes authoring dashboards bearable,
# since Grafana's file provider re-reads them every 30s. The deployed stack has no
# such mount and reads the baked copy.
#
# Ports are 127.0.0.1 only. Publishing at all is a local convenience:
# scripts/verify-signals.sh talks to these, and a VPS running any other web stack
# is likely to have something on 3000 already.

services:
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./lgtm/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./lgtm/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro

  tempo:
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./lgtm/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro

  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./lgtm/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./lgtm/grafana/dashboards:/etc/grafana/dashboards:ro
