[project]
name = "demo-app"
version = "0.1.0"
description = "Reference FastAPI app wired with obskit, for local end-to-end verification."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "obskit[grpc,sqlalchemy]",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = ["mypy>=1.18.2", "ruff>=0.14.0"]

[tool.uv]
package = false

[tool.uv.sources]
obskit = { path = "../../sdk/obskit" }

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
