[project]
name = "demo-app"
version = "0.1.0"
description = "Reference FastAPI app wired with obstack, for local end-to-end verification."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "obstack[grpc,sqlalchemy,errors]",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = ["pyright>=1.1.407", "ruff>=0.14.0"]

[tool.uv]
package = false

[tool.uv.sources]
obstack = { path = "../../sdk/obstack" }

[tool.pyright]
include = ["main.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnreachable = "error"
# See sdk/obstack/pyproject.toml — the OTel instrumentation packages ship no py.typed.
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
