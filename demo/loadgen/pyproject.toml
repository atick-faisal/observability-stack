[project]
name = "demo-loadgen"
version = "0.1.0"
description = "Steady synthetic traffic against the demo app, with a fixed error mix."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "obstack[grpc]",
    "opentelemetry-instrumentation-httpx>=0.62b1",
]

[dependency-groups]
dev = ["pyright>=1.1.407", "ruff>=0.14.0"]

[tool.uv]
package = false

[tool.uv.sources]
obstack = { path = "../../sdk/obstack" }

[tool.pyright]
include = ["main.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnreachable = "error"
# See sdk/obstack/pyproject.toml — the OTel instrumentation packages ship no py.typed.
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
