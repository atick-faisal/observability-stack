[project]
name = "obstack"
version = "0.1.0"
description = "Drop-in observability for FastAPI: structured logs, Prometheus metrics, OTLP traces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atick Faisal", email = "atickfaisal@gmail.com" }]
keywords = ["observability", "fastapi", "opentelemetry", "prometheus", "structlog"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "structlog>=25.5.0",
    "prometheus-client>=0.25.0",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "pydantic-settings>=2.2.1",
]

[project.urls]
Homepage = "https://github.com/atick-faisal/observability-stack"
Repository = "https://github.com/atick-faisal/observability-stack"
Issues = "https://github.com/atick-faisal/observability-stack/issues"

[project.optional-dependencies]
grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.41.1"]
http = ["opentelemetry-exporter-otlp-proto-http>=1.41.1"]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.62b1"]
errors = ["sentry-sdk>=2.60.0"]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "sqlalchemy>=2.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["obstack", "conftest"]
