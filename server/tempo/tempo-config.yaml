server:
  http_listen_port: 3200
  log_level: warn

usage_report:
  reporting_enabled: false

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

# /var/tempo is the image's own data directory (uid 10001). See the same note
# in loki-config.yaml.
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  processor:
    service_graphs:
      max_items: 10000
    span_metrics:
      dimensions: [app, service, env, http.route, http.response.status_code]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      # Do not add local-blocks. It holds completed parquet blocks in RAM for
      # complete_block_timeout (1h default); the reference stack measured 12 GB+
      # of growth from it. Nothing here uses TraceQL metrics queries.
      processors: [service-graphs, span-metrics]
