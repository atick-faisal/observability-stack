# 🔍 SDK checks — reusable so cd.yml (on a tag) and ci.yml (on push/PR) run the
# exact same job instead of two copies drifting apart.

name: SDK checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Empty means the triggering ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  PACKAGE_DIR: sdk/obstack

jobs:
  # 🔍 The same checks `make lint` and `make test` run, across the range the
  # package claims to support. 3.11 is requires-python's floor and mypy's
  # target; 3.13 is what the lockfile was resolved on and what the demo runs.
  checks:
    name: 🔍 Checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "${{ env.PACKAGE_DIR }}/uv.lock"

      # --locked fails rather than silently re-resolving, so a lockfile that
      # drifted from pyproject.toml is caught here instead of at install time in
      # someone else's project.
      - name: 🔧 Install dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python-version }}

      - name: 🔍 Type-check
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uv run --python ${{ matrix.python-version }} mypy src

      - name: 🔍 Lint
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: 🧪 Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uv run --python ${{ matrix.python-version }} pytest
