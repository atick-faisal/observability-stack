# 📚 Documentation — builds the MkDocs Material site and publishes it to GitHub
# Pages. Separate from ci.yml for the same reason cd.yml and nightly.yml are: it
# has a different trigger set and it is the only workflow here that needs write
# access to the repository.
#
# Two jobs. `build` runs on pull requests too, with --strict, so a link left
# dangling by a renamed or archived page fails the PR rather than becoming a 404
# nobody clicks. `deploy` runs only on main and is what actually publishes.
#
# Both call the same `make` targets a developer runs locally, and the same
# scripts/assemble-docs.sh, so "it built on my machine" and "it built in CI"
# cannot mean different things.

name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "agent/README.md"
      - "sdk/obstack/README.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/assemble-docs.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "agent/README.md"
      - "sdk/obstack/README.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/assemble-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 📖 The gate. --strict turns every unresolved cross-document link into a
  # failure, which is the whole reason this runs on pull requests.
  build:
    name: 📖 Build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-docs.txt"

      - name: 📖 Build documentation
        run: make docs-build

  # 🚀 Pushes site/ to the gh-pages branch. contents: write is scoped to this
  # job rather than the workflow so the pull_request build above cannot have it.
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh-deploy commits onto gh-pages, so it needs the branch's history, not a
      # shallow clone of main.
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-docs.txt"

      # gh-deploy commits through ghp-import, which refuses to run without a
      # committer identity. Runners have none configured.
      - name: 🔧 Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Deploy documentation
        run: |
          ./scripts/assemble-docs.sh
          uv run --with-requirements requirements-docs.txt \
            mkdocs gh-deploy --force --strict
